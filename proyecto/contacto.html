<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Guitarras Serrano</title>
    <meta name="description" content="Formulario para escribirme con consultas sobre guitarras y flamenco.">
    <meta name="keywords" content="contacto, guitarra, flamenco, consultas">
    <meta name="author" content="Antonio Serrano Hernández">
</head>

<body>
    <!-- NAV: aquí irá el menú (UD4) -->

    <!-- Cabecera: título y presentación -->
    <div>
        <h1>Contacto</h1>
        <p>Si tienes alguna duda sobre guitarras o flamenco, escríbeme rellenando este formulario.</p>
    </div>

    <!-- Sección: formulario de contacto -->
    <div>
        <h2>Escríbeme</h2>
        <form action="#" method="post">
            <!-- Bloque 1: datos personales -->
            <fieldset>
                <legend>Tus datos</legend>

                <p>
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Tu nombre" maxlength="50" required
                        autofocus>
                </p>
                <p>
                    <label for="email">Correo electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="tucorreo@ejemplo.com" required>
                </p>
                <p>
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" minlength="9" maxlength="9">
                </p>

                <p>¿Qué nivel tienes con la guitarra?</p>
                <p>
                    <input type="radio" id="nivel-principiante" name="nivel" value="principiante" checked>
                    <label for="nivel-principiante">Principiante</label>
                    <input type="radio" id="nivel-intermedio" name="nivel" value="intermedio">
                    <label for="nivel-intermedio">Intermedio</label>
                    <input type="radio" id="nivel-avanzado" name="nivel" value="avanzado">
                    <label for="nivel-avanzado">Avanzado</label>
                </p>
            </fieldset>

            <!-- Bloque 2: la consulta -->
            <fieldset>
                <legend>Tu consulta</legend>

                <p>
                    <label for="tema">¿Sobre qué quieres preguntar?</label>
                    <select id="tema" name="tema">
                        <option value="comprar">Comprar una guitarra</option>
                        <option value="clases" selected>Clases de guitarra flamenca</option>
                        <option value="accesorios">Accesorios</option>
                        <option value="guitarristas">Guitarristas</option>
                    </select>
                </p>

                <p>¿Qué tipo de guitarra te interesa?</p>
                <p>
                    <input type="checkbox" id="interes-espanola" name="interes" value="espanola">
                    <label for="interes-espanola">Española</label>
                    <input type="checkbox" id="interes-flamenca-blanca" name="interes" value="flamenca-blanca">
                    <label for="interes-flamenca-blanca">Flamenca blanca</label>
                    <input type="checkbox" id="interes-flamenca-negra" name="interes" value="flamenca-negra">
                    <label for="interes-flamenca-negra">Flamenca negra</label>
                </p>

                <p>
                    <label for="mensaje">Mensaje:</label>
                    <textarea id="mensaje" name="mensaje" rows="5" cols="40" placeholder="Escribe aquí tu consulta"
                        minlength="10" required></textarea>
                </p>
            </fieldset>

            <!-- Botones -->
            <p>
                <input type="submit" value="Enviar">
                <input type="reset" value="Borrar">
            </p>
        </form>
    </div>

    <!-- Pie de página -->
    <div>
        <p>&copy; 2026 Antonio Serrano</p>
    </div>
</body>

</html>
